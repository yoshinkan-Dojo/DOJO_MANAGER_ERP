[project]
name = "dojo-manager-erp"
version = "0.9.5"
description = "ERP especializado para gestão de escolas de artes marciais"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-jose[cryptography]>=3.5",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.3",
    "python-dotenv>=1.1"
]


[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12"
]


[tool.ruff]
line-length = 100


[tool.pytest.ini_options]
testpaths = [
    "tests"
]


[build-system]
requires = [
    "hatchling"
]

build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = [
    "app"
]